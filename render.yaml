# Blueprint Render — deploy dell'API
# (Dashboard → New → Blueprint → seleziona questo repo).
#
# Dal 05/11/2026 API e database stanno a Francoforte, a pagamento
# (docs/changelog/2026-11-05-render-francoforte.md): servizio
# professionisti-api-eu (Starter, sempre acceso, così promemoria e attività a
# orario girano davvero) e Postgres professionisti-db-eu (Basic-256mb, non
# scade). Il vecchio professionisti-api in Oregon, con il database gratuito
# scaduto il 05/11, è da sospendere.
#
# Tutte le variabili lette dall'API stanno qui sotto (anche quelle facoltative,
# con sync: false), così un servizio ricreato dal Blueprint le propone tutte.
# Una variabile nuova nel codice va aggiunta anche qui e in docs/ops/variabili.md.
#
# Il database NON è dichiarato qui (docs/CHANGELOG.md §229): DATABASE_URL si
# imposta a mano dalla dashboard (Internal Database URL del database in uso),
# così una sincronizzazione del Blueprint non può mai collegare l'API a un
# database diverso o crearne uno vuoto.
#
# Render inietta automaticamente PORT: l'API la legge già da process.env.PORT
# e ascolta su 0.0.0.0 (apps/api/src/main.ts), quindi nessuna config extra.

services:
  - type: web
    name: professionisti-api-eu
    region: frankfurt
    runtime: node
    # Versione di Node: quella esatta di .nvmrc (docs/CHANGELOG.md §373).
    # Non impostare NODE_VERSION nella dashboard: avrebbe la precedenza su
    # .nvmrc e l'API resterebbe su una versione vecchia.
    plan: starter
    branch: claude/professionisti-platform-architecture-xr9gmn
    healthCheckPath: /health
    # Monorepo pnpm: root directory = radice del repo (workspace manifest,
    # lockfile e packages condivisi devono restare raggiungibili), build e
    # start scoperti sul solo servizio API via --filter.
    # Lo script "build" di apps/api compila già database + shared prima di
    # "nest build"; lo script "start" esegue "prisma migrate deploy"
    # (migrazioni esplicite tracciate in packages/database/prisma/migrations,
    # mai distruttive in automatico — sostituisce "prisma db push
    # --accept-data-loss": CEO, audit tecnico, "un push che droppa una
    # colonna è perdita dati silenziosa") prima di avviare il server.
    # Il database esistente (nato con db push, senza storico migrazioni)
    # viene "baselinato" in automatico al primo avvio: vedi
    # packages/database/scripts/migrate-deploy.mjs e CLAUDE.md §2.
    # Niente "corepack enable": con Node 24 Render ha già pnpm in /usr/bin
    # (cartella di sola lettura) e il comando falliva con EROFS
    # (docs/CHANGELOG.md §377). pnpm legge la versione da "packageManager".
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @professionisti/api build
    startCommand: pnpm --filter @professionisti/api start
    # Rebuild automatico solo quando cambia qualcosa che può influenzare l'API
    buildFilter:
      paths:
        - apps/api/**
        - packages/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - .npmrc
        - .nvmrc
        - render.yaml
    envVars:
      # Internal Database URL del Postgres in uso, incollata dalla dashboard:
      # niente fromDatabase, vedi la nota in cima al file.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Valorizzare dalla dashboard Render dopo la creazione (sync:false =
      # il valore non sta nel repo, lo inserisci tu una sola volta):
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Chiave di firma del secondo endpoint webhook, quello "Connect" per gli
      # eventi degli account dei professionisti (account.updated): stesso URL
      # /billing/webhook, endpoint separato su Stripe (docs/CHANGELOG.md §236).
      - key: STRIPE_CONNECT_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_BOOTSTRAP_SECRET
        sync: false
      # Controllo di codice fiscale e partita IVA all'Agenzia delle Entrate e
      # al Registro Imprese (Openapi, docs/CHANGELOG.md §253). Senza token il
      # controllo è saltato e non blocca nulla; OPENAPI_SANDBOX=true per le prove.
      - key: OPENAPI_TOKEN_RISK
        sync: false
      - key: OPENAPI_TOKEN_COMPANY
        sync: false
      - key: OPENAPI_SANDBOX
        sync: false
      # Verifica documento + selfie (Didit, docs/CHANGELOG.md §253). Senza
      # chiave e workflow la verifica non è richiesta per i preventivi.
      # Webhook su Didit: <URL API>/identity-verification/webhook.
      - key: DIDIT_API_KEY
        sync: false
      - key: DIDIT_WORKFLOW_ID
        sync: false
      - key: DIDIT_WEBHOOK_SECRET
        sync: false
      # true solo con la chiave di un'applicazione Didit di prova: Didit
      # restituisce dati finti e il confronto con i dati fiscali si salta
      # (docs/CHANGELOG.md §272). Da togliere al lancio.
      - key: DIDIT_SANDBOX
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      # Promemoria su WhatsApp con Meta (docs/whatsapp-modelli.md): senza
      # token e numero non parte nulla. Tetto al giorno facoltativo (500).
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_DAILY_LIMIT
        sync: false
      # Prezzi Stripe mensili dei livelli Base/Plus/Pro (price_...), letti da
      # apps/api/src/billing/billing.service.ts.
      - key: STRIPE_PRICE_BASE
        sync: false
      - key: STRIPE_PRICE_PLUS
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      # Chiave server Google Maps (Geocoding API) per posizionare
      # l'indirizzo preciso del professionista sulla mappa
      # (apps/api/src/geocoding/geocoding.service.ts). Distinta dalla chiave
      # del browser NEXT_PUBLIC_GOOGLE_MAPS_API_KEY impostata su Vercel.
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      # Dal problema scritto ai mestieri (docs/CHANGELOG.md §392): Claude
      # Haiku solo quando il dizionario ha un dubbio. Senza, resta il
      # dizionario. PROBLEM_MATCH_AI_DAILY_LIMIT cambia il tetto (3000).
      - key: ANTHROPIC_API_KEY
        sync: false
      # Solo fino al lancio (docs/CHANGELOG.md §394): senza ANTHROPIC_API_KEY
      # lo stesso modello attraverso OpenRouter. Da togliere al lancio.
      - key: OPENROUTER_API_KEY
        sync: false
      # Error tracking (apps/api/src/instrument.ts): DSN del progetto Sentry,
      # senza il quale gli errori restano solo nei log di Render.
      - key: SENTRY_DSN
        sync: false
      # Indirizzo del sito: CORS (apps/api/src/app-setup.ts), link nelle email
      # e ritorni da Stripe. AL CAMBIO DI DOMINIO va cambiato qui e su Render
      # insieme agli altri posti di docs/ops/cambio-dominio.md: se resta il
      # vecchio, dal dominio nuovo nessuna chiamata all'API passa.
      - key: FRONTEND_URL
        value: https://applicazione-web.vercel.app

      # --- Variabili lette dal codice che prima mancavano qui ------------------
      # (docs/changelog/2026-11-08-infrastruttura-lancio.md, controllo E9-03):
      # un servizio ricreato dal Blueprint le "dimenticava" senza avvisi.
      # Elenco completo con cosa succede se mancano: docs/ops/variabili.md.

      # Chiave dei dati fiscali (IBAN, codici fiscali, impronte email:
      # apps/api/src/common/fiscal-crypto.ts). OBBLIGATORIA: senza, l'API cifra
      # con una chiave presa da JWT_SECRET, e cambiando JWT_SECRET i dati
      # diventerebbero illeggibili. Si imposta una volta e non si cambia più.
      - key: FISCAL_DATA_KEY
        sync: false
      # Giorno del lancio (AAAA-MM-GG): da lì mesi gratis, carta obbligatoria,
      # pause e numeri del sito (CLAUDE.md §6 e §5 punto 17).
      - key: LAUNCH_DATE
        sync: false
      # Aliquota IVA di Stripe (txr_...): senza, nessun abbonamento si compra.
      - key: STRIPE_TAX_RATE_IVA
        sync: false
      # Prezzi annuali (per ora non offerti: l'annuale torna con i dati reali).
      - key: STRIPE_PRICE_BASE_ANNUAL
        sync: false
      - key: STRIPE_PRICE_PLUS_ANNUAL
        sync: false
      - key: STRIPE_PRICE_PRO_ANNUAL
        sync: false
      # true dopo il dominio verificato su Resend: conferma dell'email obbligatoria.
      - key: EMAIL_VERIFICATION_REQUIRED
        sync: false
      # Anti-bot Cloudflare Turnstile: prima la chiave del sito su Vercel, poi questa.
      - key: TURNSTILE_SECRET_KEY
        sync: false
      # Invio delle nostre fatture allo SdI con Openapi (apps/api/src/accounting/sdi-provider.ts).
      - key: OPENAPI_TOKEN_SDI
        sync: false
      # "false" spegne le richieste generali (senza professionista scelto).
      - key: GENERAL_REQUESTS_ENABLED
        sync: false
      # Tetto al giorno delle chiamate a Google dalle pagine aperte a tutti
      # (suggerimenti di indirizzo, CAP, mappa fissa). Vuota = tetti di serie,
      # già vicini alla quota gratuita (apps/api/src/common/daily-budget.ts).
      - key: GOOGLE_PUBLIC_DAILY_LIMIT
        sync: false
      # Logo delle email (di serie l'icona del sito).
      - key: EMAIL_LOGO_URL
        sync: false
      # Intelligenza artificiale: tetto di dubbi al giorno (3000) e modello di
      # OpenRouter (solo fino al lancio, poi via insieme a OPENROUTER_API_KEY).
      - key: PROBLEM_MATCH_AI_DAILY_LIMIT
        sync: false
      - key: OPENROUTER_MODEL
        sync: false
      # WhatsApp: versione delle API di Meta e prezzi per il registro dei costi
      # (vuote = valori di serie, apps/api/src/whatsapp/whatsapp-env.ts).
      - key: WHATSAPP_GRAPH_VERSION
        sync: false
      - key: WHATSAPP_PRICE_UTILITY_MICRO_EUR
        sync: false
      - key: WHATSAPP_PRICE_AUTHENTICATION_MICRO_EUR
        sync: false
      # Mai in produzione: RATE_LIMIT_PER_MINUTE (solo prove) e TZ (le attività
      # a orario hanno già l'ora italiana, apps/api/src/common/scheduled-job.ts).
