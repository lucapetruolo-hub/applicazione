# Blueprint Render — deploy dell'API
# (Dashboard → New → Blueprint → seleziona questo repo).
#
# Il database NON è dichiarato qui (docs/CHANGELOG.md §229): il Postgres free
# scade dopo 30 giorni e va ricreato con un nome nuovo (oggi
# professionisti-db-2), quindi un nome fisso nel Blueprint finiva per puntare
# a un database scaduto, e a ogni sincronizzazione Render avrebbe potuto
# ricrearne uno vuoto con quel nome e collegarci l'API. DATABASE_URL si
# imposta a mano dalla dashboard (Internal Database URL del database in uso).
#
# Sostituisce l'hosting Railway (piano free scaduto). Note sul free tier Render:
# - Il web service free va in sleep dopo 15 min di inattività (~1 min di
#   cold start alla prima richiesta successiva). 750 ore/mese incluse.
# - Il Postgres free ha 1 GB e SCADE DOPO 30 GIORNI: alla scadenza va creato
#   un nuovo database free, copiata la sua Internal Database URL in
#   DATABASE_URL del servizio API (le migrazioni partono da sole all'avvio).
# - Render inietta automaticamente PORT: l'API la legge già da process.env.PORT
#   e ascolta su 0.0.0.0 (apps/api/src/main.ts), quindi nessuna config extra.

services:
  - type: web
    name: professionisti-api
    runtime: node
    # Versione di Node: quella esatta di .nvmrc (docs/CHANGELOG.md §373).
    # Non impostare NODE_VERSION nella dashboard: avrebbe la precedenza su
    # .nvmrc e l'API resterebbe su una versione vecchia.
    plan: free
    branch: claude/professionisti-platform-architecture-xr9gmn
    healthCheckPath: /health
    # Monorepo pnpm: root directory = radice del repo (workspace manifest,
    # lockfile e packages condivisi devono restare raggiungibili), build e
    # start scoperti sul solo servizio API via --filter.
    # Lo script "build" di apps/api compila già database + shared prima di
    # "nest build"; lo script "start" esegue "prisma migrate deploy"
    # (migrazioni esplicite tracciate in packages/database/prisma/migrations,
    # mai distruttive in automatico — sostituisce "prisma db push
    # --accept-data-loss": CEO, audit tecnico, "un push che droppa una
    # colonna è perdita dati silenziosa") prima di avviare il server.
    # Il database esistente (nato con db push, senza storico migrazioni)
    # viene "baselinato" in automatico al primo avvio: vedi
    # packages/database/scripts/migrate-deploy.mjs e CLAUDE.md §2.
    # Niente "corepack enable": con Node 24 Render ha già pnpm in /usr/bin
    # (cartella di sola lettura) e il comando falliva con EROFS
    # (docs/CHANGELOG.md §377). pnpm legge la versione da "packageManager".
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @professionisti/api build
    startCommand: pnpm --filter @professionisti/api start
    # Rebuild automatico solo quando cambia qualcosa che può influenzare l'API
    buildFilter:
      paths:
        - apps/api/**
        - packages/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - .npmrc
        - .nvmrc
        - render.yaml
    envVars:
      # Internal Database URL del Postgres in uso, incollata dalla dashboard:
      # niente fromDatabase, vedi la nota in cima al file.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Valorizzare dalla dashboard Render dopo la creazione (sync:false =
      # il valore non sta nel repo, lo inserisci tu una sola volta):
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Chiave di firma del secondo endpoint webhook, quello "Connect" per gli
      # eventi degli account dei professionisti (account.updated): stesso URL
      # /billing/webhook, endpoint separato su Stripe (docs/CHANGELOG.md §236).
      - key: STRIPE_CONNECT_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_BOOTSTRAP_SECRET
        sync: false
      # Controllo di codice fiscale e partita IVA all'Agenzia delle Entrate e
      # al Registro Imprese (Openapi, docs/CHANGELOG.md §253). Senza token il
      # controllo è saltato e non blocca nulla; OPENAPI_SANDBOX=true per le prove.
      - key: OPENAPI_TOKEN_RISK
        sync: false
      - key: OPENAPI_TOKEN_COMPANY
        sync: false
      - key: OPENAPI_SANDBOX
        sync: false
      # Verifica documento + selfie (Didit, docs/CHANGELOG.md §253). Senza
      # chiave e workflow la verifica non è richiesta per i preventivi.
      # Webhook su Didit: <URL API>/identity-verification/webhook.
      - key: DIDIT_API_KEY
        sync: false
      - key: DIDIT_WORKFLOW_ID
        sync: false
      - key: DIDIT_WEBHOOK_SECRET
        sync: false
      # true solo con la chiave di un'applicazione Didit di prova: Didit
      # restituisce dati finti e il confronto con i dati fiscali si salta
      # (docs/CHANGELOG.md §272). Da togliere al lancio.
      - key: DIDIT_SANDBOX
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      # Prezzi Stripe mensili dei livelli Base/Plus/Pro (price_...), letti da
      # apps/api/src/billing/billing.service.ts.
      - key: STRIPE_PRICE_BASE
        sync: false
      - key: STRIPE_PRICE_PLUS
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      # Chiave server Google Maps (Geocoding API) per posizionare
      # l'indirizzo preciso del professionista sulla mappa
      # (apps/api/src/geocoding/geocoding.service.ts). Distinta dalla chiave
      # del browser NEXT_PUBLIC_GOOGLE_MAPS_API_KEY impostata su Vercel.
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      # Dal problema scritto ai mestieri (docs/CHANGELOG.md §387): Claude
      # Haiku solo quando il dizionario ha un dubbio. Senza, resta il
      # dizionario. PROBLEM_MATCH_AI_DAILY_LIMIT cambia il tetto (3000).
      - key: ANTHROPIC_API_KEY
        sync: false
      # Error tracking (apps/api/src/instrument.ts): DSN del progetto Sentry,
      # senza il quale gli errori restano solo nei log di Render.
      - key: SENTRY_DSN
        sync: false
      - key: FRONTEND_URL
        value: https://applicazione-web.vercel.app
