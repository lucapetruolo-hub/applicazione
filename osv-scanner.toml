# Eccezioni di osv-scanner (docs/CHANGELOG.md §314). Ognuna con il motivo.

# deepmerge non ha una versione corretta (GHSA-gcqx-w48m-w2h4, docs/CHANGELOG.md
# §384, eccezione approvata da Luca il 27/10/2026). Il difetto scatta solo
# unendo un oggetto scritto da chi attacca. Nell'API lo usa html-to-text (via
# @react-email/render, testo semplice delle email) solo per unire le sue
# opzioni fisse, mai il contenuto; il resto è in strumenti di sviluppo
# (@expo/config, CLI di React Native, fork-ts-checker).
[[PackageOverrides]]
name = "deepmerge"
version = "4.3.1"
ecosystem = "npm"
vulnerability.ignore = true
reason = "Nessuna versione corretta; unisce solo opzioni fisse (html-to-text) e strumenti di sviluppo, mai dati delle persone"

# minimatch 3 non ha una versione corretta di GHSA-g3hv-75wg-m249 (la prima è
# la 11, con un'altra API). Lo usano solo strumenti di sviluppo: le regole di
# accessibilità di ESLint (eslint-plugin-jsx-a11y) e il controllo dei tipi del
# build di Nest (fork-ts-checker), con schemi di file scritti da noi, mai dati
# delle persone. Le versioni 10 sono passate alla 11 in pnpm-workspace.yaml.
[[PackageOverrides]]
name = "minimatch"
version = "3.1.5"
ecosystem = "npm"
vulnerability.ignore = true
reason = "Nessuna versione 3 corretta; solo ESLint jsx-a11y e fork-ts-checker, schemi di file nostri"
