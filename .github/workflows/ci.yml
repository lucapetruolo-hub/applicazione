name: CI

# Pipeline minima (CEO — audit tecnico: "zero CI/CD" era un blocco reale
# prima di avere utenti paganti, nulla impediva un push rotto in
# produzione). Blocca un push/PR che non compila o non passa il typecheck
# — non sostituisce una suite di test reale (vedi packages/*/vitest.config.ts,
# ancora minima), ma è la prima rete di sicurezza automatica del progetto.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  typecheck-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.0

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        # DATABASE_URL fittizia: "prisma generate" (eseguito dallo step
        # "build" dei package a monte, dipendenza di typecheck in
        # turbo.json) legge lo schema per generare il client TS — non
        # apre mai una connessione reale, ma l'URL deve comunque essere
        # una stringa presente e sintatticamente valida.
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: pnpm turbo run typecheck

      - name: Lint
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: pnpm turbo run lint

      - name: Build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: pnpm turbo run build

      # Il build compila anche con un import circolare tra moduli Nest, ma
      # l'API poi non parte (docs/CHANGELOG.md §218): qui si costruisce il
      # grafo dei moduli senza database, come fa l'avvio su Render.
      - name: Avvio API (grafo dei moduli)
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: node apps/api/scripts/check-boot.mjs

      - name: Test
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: pnpm turbo run test

      # Controllo SEO (docs/CHANGELOG.md §296) contro un'API finta: prima il
      # sito privato appena costruito (tutto noindex, sitemap vuota), poi una
      # build col sito aperto (un H1, canonical, titolo, nessun noindex per
      # sbaglio, dati strutturati, redirect dei profili, 404, sitemap).
      - name: Controllo SEO (sito privato)
        run: node apps/web/scripts/seo-check/run.mjs private

      - name: Controllo SEO (sito aperto)
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          NEXT_PUBLIC_SITE_INDEXABLE: "true"
        run: |
          pnpm --filter @professionisti/web build
          node apps/web/scripts/seo-check/run.mjs public

  # Test dei permessi (docs/CHANGELOG.md §297): ogni rotta dell'API chiamata
  # senza accesso, con ogni ruolo (cliente, professionista, admin di ogni
  # tipo) e con gli id di un altro utente, su un Postgres vuoto creato qui.
  # Una rotta nuova non classificata in apps/api/scripts/access-policy.mjs
  # fa fallire il job.
  access-matrix:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.0

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm --filter @professionisti/api build

      - name: Migrazioni
        working-directory: packages/database
        run: npx prisma migrate deploy

      - name: Test dei permessi
        env:
          ACCESS_MATRIX_RESET_DB: "yes"
        run: node apps/api/scripts/access-matrix.mjs
