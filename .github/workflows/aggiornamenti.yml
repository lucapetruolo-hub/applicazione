name: Aggiornamenti non coperti

# Quello che Dependabot e osv-scanner non vedono (richiesta di Luca del
# 02/11/2026, docs/changelog/2026-10-30-admin-persone.md): versioni nuove di
# React, React Native ed Expo, esclusi da Dependabot perché si aggiornano a
# mano e insieme, e la fine del supporto di Next.js, React, React Native e
# NestJS, con 6 mesi di preavviso. Ogni avviso apre una segnalazione (issue),
# che GitHub manda per email. Node ha il suo controllo (node.yml), PostgreSQL
# lo controlla l'API (database-version.service.ts).
on:
  schedule:
    - cron: "41 5 1 * *"
  pull_request:
    paths:
      - scripts/controlla-aggiornamenti.mjs
      - .github/workflows/aggiornamenti.yml
  workflow_dispatch:

permissions: {}

jobs:
  controlla:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Confronto con npm ed endoflife.date
        run: node scripts/controlla-aggiornamenti.mjs > "$RUNNER_TEMP/avvisi.json"

      # Sulle PR solo la prova che lo script funziona, senza segnalazioni.
      - name: Segnalazioni
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          AVVISI_FILE: ${{ runner.temp }}/avvisi.json
        run: |
          count=$(jq length "$AVVISI_FILE")
          for i in $(seq 0 $((count - 1))); do
            titolo=$(jq -r ".[$i].titolo" "$AVVISI_FILE")
            if gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$titolo\" in:title" --json title --jq '.[].title' | grep -Fxq "$titolo"; then
              echo "Segnalazione già aperta: $titolo"
              continue
            fi
            jq -r ".[$i].corpo" "$AVVISI_FILE" > "$RUNNER_TEMP/corpo.md"
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$titolo" --body-file "$RUNNER_TEMP/corpo.md"
          done
