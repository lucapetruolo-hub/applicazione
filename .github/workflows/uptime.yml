# Controllo "il sito è su?" (CEO, tattico — docs/CHANGELOG.md §132): ogni 10
# minuti interroga l'API e la homepage. Se uno dei due non risponde il
# workflow fallisce e GitHub manda un'email di avviso (una sola, al primo
# giro rosso; poi di nuovo solo dopo che è tornato verde).
#
# Dall'08/11/2026 (docs/changelog/2026-11-08-infrastruttura-lancio.md) chiede
# /health/db, che risponde solo se anche il database risponde: il 05/11 il
# database era scaduto e /health restava verde mentre ogni pagina dava errore.
# L'API su Render Starter è sempre accesa: il ping non serve più a tenerla
# sveglia.
#
# Configurazione: GitHub → Settings → Secrets and variables → Actions →
# Variables: API_HEALTH_URL (es. https://<nome>.onrender.com/health) e
# SITE_URL (es. https://applicazione-web.vercel.app). Senza variabili il
# controllo viene saltato. I workflow schedulati girano solo sul branch
# predefinito del repository.
name: Uptime

on:
  schedule:
    - cron: "*/10 * * * *"
    # Una volta al giorno anche i suggerimenti di indirizzo di Google (§324).
    - cron: "17 7 * * *"
    # Ogni ora lo stream in tempo reale delle notifiche (§332).
    - cron: "37 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: API e database
        if: ${{ vars.API_HEALTH_URL != '' }}
        env:
          API_HEALTH_URL: ${{ vars.API_HEALTH_URL }}
        # --retry: il primo tentativo dopo uno sleep può superare il minuto
        # (cold start di Render), non è un sito giù. Si riprova per circa due
        # minuti: il 25/10/2026 Render ha risposto "troppe richieste" (429)
        # per una ventina di secondi e il controllo è diventato rosso senza
        # che il sito fosse giù (docs/changelog/2026-10-28-prove-ripetute.md).
        # Un sito davvero giù fallisce lo stesso a ogni tentativo.
        # --retry-all-errors: anche un 503 (database lento per un attimo) si
        # riprova; un database davvero giù resta rosso a ogni tentativo.
        run: curl --fail --silent --show-error --max-time 90 --retry 5 --retry-all-errors --retry-delay 15 --retry-max-time 120 "${API_HEALTH_URL%/health}/health/db"
      - name: Sito web
        if: ${{ vars.SITE_URL != '' }}
        run: curl --fail --silent --show-error --output /dev/null --max-time 30 --retry 5 --retry-delay 15 --retry-max-time 120 "${{ vars.SITE_URL }}"
      # Suggerimenti di indirizzo (docs/CHANGELOG.md §324): il 24/10/2026 Google
      # rifiutava la chiave e lo si è scoperto solo provando il sito. Una
      # volta al giorno (una sola chiamata a pagamento): se la chiave è
      # rifiutata o manca, il workflow fallisce e GitHub manda l'email.
      - name: Suggerimenti di indirizzo
        if: ${{ vars.API_HEALTH_URL != '' && (github.event.schedule == '17 7 * * *' || github.event_name == 'workflow_dispatch') }}
        env:
          API_HEALTH_URL: ${{ vars.API_HEALTH_URL }}
        run: |
          api="${API_HEALTH_URL%/health}"
          curl --fail --silent --show-error --max-time 90 --retry 2 --retry-delay 10 \
            "$api/address/suggestions?q=via%20roma%201%20latina&session=uptime-$(date +%s)" | grep -q '"id"'
      # Stream in tempo reale (docs/CHANGELOG.md §331-§332): il 24/10/2026
      # rispondeva 200 ma senza eventi, e nessuno se n'era accorto. Entra con
      # l'account di prova (secret UPTIME_EMAIL e UPTIME_PASSWORD), apre lo
      # stream e aspetta il battito dei 25 secondi, che deve avere contenuto.
      - name: Stream in tempo reale
        if: ${{ vars.API_HEALTH_URL != '' && (github.event.schedule == '37 * * * *' || github.event_name == 'workflow_dispatch') }}
        env:
          API_HEALTH_URL: ${{ vars.API_HEALTH_URL }}
          UPTIME_EMAIL: ${{ secrets.UPTIME_EMAIL }}
          UPTIME_PASSWORD: ${{ secrets.UPTIME_PASSWORD }}
        run: |
          # Senza segreti il controllo non si salta più in silenzio (E9-16,
          # docs/changelog/2026-11-08-infrastruttura-lancio.md): fallisce e
          # GitHub manda l'email, così ci si ricorda di rifare l'account.
          if [ -z "$UPTIME_EMAIL" ] || [ -z "$UPTIME_PASSWORD" ]; then echo "::error::Secret UPTIME_EMAIL/UPTIME_PASSWORD mancanti: crea un account di prova e aggiungili (docs/ops/avvisi.md)."; exit 1; fi
          api="${API_HEALTH_URL%/health}"
          body=$(jq -n --arg email "$UPTIME_EMAIL" --arg password "$UPTIME_PASSWORD" '{email: $email, password: $password}')
          token=$(curl --fail --silent --show-error --max-time 90 --retry 2 --retry-delay 10 -H 'content-type: application/json' -d "$body" "$api/auth/login" | jq -r .token)
          ticket=$(curl --fail --silent --show-error --max-time 30 -X POST -H "Authorization: Bearer $token" "$api/realtime/ticket" | jq -r .ticket)
          stream=$(curl --silent --no-buffer --max-time 35 "$api/realtime/stream?ticket=$ticket" || true)
          echo "$stream" | grep -q '^data: {"kind":"ping"}' || { echo "Stream senza eventi: $stream"; exit 1; }
