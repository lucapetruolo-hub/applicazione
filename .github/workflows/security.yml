name: Controlli di sicurezza

# Strumenti automatici di controllo (docs/CHANGELOG.md §303-§304). I
# risultati di CodeQL, Semgrep e osv-scanner finiscono nella scheda
# "Security → Code scanning" del repository. Bloccano la PR CodeQL e
# Semgrep (il codice è pulito: una segnalazione nuova va corretta, o
# riscritta se è un falso allarme, perché GitHub mostra l'avviso anche con un
# commento che la ignora) e gitleaks (una chiave nel codice va tolta subito,
# il repository è pubblico). osv-scanner resta solo rapporto: quasi tutti gli
# avvisi riguardano librerie usate per costruire o provare il codice.
# Il giro del lunedì trova le vulnerabilità nuove anche senza modifiche.
on:
  push:
    branches: ["claude/professionisti-platform-architecture-xr9gmn"]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
          # Stesso perimetro di Semgrep: il codice che arriva agli utenti.
          config: |
            paths-ignore:
              - "**/*.test.ts"
              - "apps/*/scripts"
      - uses: github/codeql-action/analyze@v4
        with:
          category: codeql
          output: codeql-results
      - name: Nessuna segnalazione nuova
        # Errori e avvisi bloccano; i semplici consigli ("note") restano nella scheda Security.
        run: |
          python3 - <<'PY'
          import glob, json, sys
          found = []
          for path in glob.glob("codeql-results/*.sarif"):
              for run in json.load(open(path))["runs"]:
                  for r in run.get("results", []):
                      if r.get("level", "warning") in ("error", "warning"):
                          loc = r["locations"][0]["physicalLocation"]
                          found.append(f'{r["ruleId"]} {loc["artifactLocation"]["uri"]}:{loc.get("region", {}).get("startLine")} {r["message"]["text"][:160]}')
          print("\n".join(found) or "CodeQL: nessuna segnalazione")
          sys.exit(1 if found else 0)
          PY

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Semgrep
        run: |
          pip install --quiet semgrep==1.182.1
          # Fuori i test (le chiavi finte le controlla gitleaks) e gli script
          # di controllo della CI in apps/*/scripts, che non arrivano agli utenti.
          semgrep scan --metrics=off --exclude "*.test.ts" --exclude "apps/*/scripts" \
            --config p/default --config p/nodejs --config p/typescript --config p/secrets \
            --sarif --output semgrep.sarif apps packages
          semgrep scan --metrics=off --exclude "*.test.ts" --exclude "apps/*/scripts" --error \
            --config p/default --config p/nodejs --config p/typescript --config p/secrets \
            apps packages
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  osv-scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Librerie con vulnerabilità note
        run: |
          curl -sSfL -o osv-scanner https://github.com/google/osv-scanner/releases/download/v2.0.2/osv-scanner_linux_amd64
          chmod +x osv-scanner
          ./osv-scanner scan source --lockfile pnpm-lock.yaml --format sarif --output osv.sarif || true
          ./osv-scanner scan source --lockfile pnpm-lock.yaml --format markdown >> "$GITHUB_STEP_SUMMARY" || true
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: osv.sarif
          category: osv-scanner

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Chiavi e password nel codice (tutta la cronologia)
        # --redact: il registro del job è pubblico, mai stampare il segreto.
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --redact --no-banner --verbose .
