packages:
  - "apps/*"
  - "packages/*"
  - "e2e"
allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
peerDependencyRules:
  ignoreMissing:
    - "react-native"
    - "react-native-svg"
  allowedVersions:
    react: "19"
# Una sola versione di React e React Native in tutto il monorepo (sito e app
# su React 19, docs/CHANGELOG.md §299): senza, i pacchetti condivisi
# (packages/ui, Tamagui) si portavano dietro copie diverse. Più le versioni
# corrette di dipendenze indirette con falle note (controllo sicurezza,
# docs/CHANGELOG.md §292): multer 2.0.2 e proxy-addr 2.0.7. Una sola rxjs
# (docs/CHANGELOG.md §331): con una seconda copia NestJS non riconosce
# l'Observable dello stream in tempo reale e i push arrivano vuoti. Le ultime
# tre (docs/CHANGELOG.md §335) correggono falle note dove il pacchetto che le
# usa fissa una versione vecchia: postcss in Next.js (prepara i CSS nella
# build), deepmerge-ts nella configurazione di Prisma, fast-xml-parser negli
# strumenti di React Native per Android. Stessa API, solo versioni nuove.
overrides:
  react: "19.3.0"
  react-dom: "19.3.0"
  react-native: "0.88.0"
  react-native-reanimated: "4.7.1"
  react-native-worklets: "0.13.0"
  "@react-native/metro-config": "0.88.0"
  multer: "^2.3.0"
  proxy-addr: "^2.0.8"
  rxjs: "7.8.2"
  "postcss@<8.5.23": "^8.5.31"
  "deepmerge-ts@<8": "^8.0.2"
  "fast-xml-parser@<5.7.0": "^5.11.2"
