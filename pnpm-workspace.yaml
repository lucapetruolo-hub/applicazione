packages:
  - "apps/*"
  - "packages/*"
  - "e2e"
allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
peerDependencyRules:
  ignoreMissing:
    - "react-native"
    - "react-native-svg"
  allowedVersions:
    react: "18"
# Versioni corrette di dipendenze indirette con falle note (controllo
# sicurezza, docs/CHANGELOG.md §292): @nestjs/platform-express 10 si ferma a
# multer 2.0.2, express 4 a proxy-addr 2.0.7.
overrides:
  multer: "^2.3.0"
  proxy-addr: "^2.0.8"
