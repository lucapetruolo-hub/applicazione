packages:
  - "apps/*"
  - "packages/*"
  - "e2e"
allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
peerDependencyRules:
  ignoreMissing:
    - "react-native"
    - "react-native-svg"
  allowedVersions:
    react: "19"
# Una sola versione di React e React Native in tutto il monorepo (sito e app
# su React 19, docs/CHANGELOG.md §299): senza, i pacchetti condivisi
# (packages/ui, Tamagui) si portavano dietro copie diverse. Più le versioni
# corrette di dipendenze indirette con falle note (controllo sicurezza,
# docs/CHANGELOG.md §292): multer 2.0.2 e proxy-addr 2.0.7. Una sola rxjs
# (docs/CHANGELOG.md §329): con una seconda copia NestJS non riconosce
# l'Observable dello stream in tempo reale e i push arrivano vuoti.
overrides:
  react: "19.3.0"
  react-dom: "19.3.0"
  react-native: "0.88.0"
  react-native-reanimated: "4.7.1"
  react-native-worklets: "0.13.0"
  "@react-native/metro-config": "0.88.0"
  multer: "^2.3.0"
  proxy-addr: "^2.0.8"
  rxjs: "7.8.2"
